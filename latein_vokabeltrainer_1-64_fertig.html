<!DOCTYPE html>
<html lang="de">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latein Vokabeltrainer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: black;
}

header {
    background: black;
    color: white;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

select,
input,
button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    font-size: 18px;
    border-radius: 10px;
}

select,
input {
    border: 2px solid #222;
    background: white;
    color: black;
}

button {
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#trainer {
    display: none;
}

#frage {
    font-size: 38px;
    font-weight: bold;
    text-align: center;
    margin: 35px 0;
    word-wrap: break-word;
}

.info {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-bottom: 15px;
}

#meldung {
    min-height: 30px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-top: 18px;
}

#ende {
    display: none;
    text-align: center;
}

#ende h2 {
    font-size: 35px;
}

#punkteEnde {
    font-size: 55px;
    font-weight: bold;
}

.klein {
    text-align: center;
    color: #555;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Latein Vokabeltrainer</h1>
</header>

<div class="container">

    <!-- START -->
    <div id="start">
        <h2>Wortschatz auswählen</h2>

        <select id="lektion">
            <option value="">Bitte WS auswählen</option>
        </select>

        <button onclick="starten()">Lektion starten</button>

        <p class="klein">
            Abgefragt werden die Lernwörter aus dem Buch.
        </p>
    </div>


    <!-- TRAINER -->
    <div id="trainer">

        <div class="info">
            <span>Punkte: <b id="punkte">0</b></span>
            <span id="fortschritt">1 / 1</span>
        </div>

        <div id="frage"></div>

        <input
            id="antwort"
            type="text"
            placeholder="Deutsche Bedeutung eingeben"
            autocomplete="off"
        >

        <button onclick="pruefen()">Antwort prüfen</button>

        <div id="meldung"></div>

        <button onclick="naechsteFrage()">Nächste Vokabel</button>

        <button onclick="zurueck()">
            Zurück zur Auswahl
        </button>

    </div>


    <!-- ENDE -->
    <div id="ende">

        <h2>Geschafft!</h2>

        <p>Deine Punktzahl:</p>

        <div id="punkteEnde">0</div>

        <button onclick="zurueck()">
            Neue Lektion
        </button>

    </div>

</div>

/*
=========================================================
EINSTELLUNG
=========================================================
*/

const auswahl = document.getElementById("lektion");

for (let i = 1; i <= 64; i++) {

    const option = document.createElement("option");

    option.value = i;

    if (vokabeln[i]) {
        option.textContent = "WS " + i;
    } else if (i === 48) {
        option.textContent = "WS 48 – nicht im Buch vorhanden";
    } else {
        option.textContent = "WS " + i + " – nicht in dieser PDF";
    }

    auswahl.appendChild(option);
}


/*
=========================================================
SPIELVARIABLEN
=========================================================
*/

let aktuelleVokabeln = [];
let aktuelleNummer = 0;
let punkte = 0;
let beantwortet = false;


/*
=========================================================
STARTEN
=========================================================
*/

function starten() {

    const nummer = Number(auswahl.value);

    if (!nummer) {
        alert("Bitte zuerst einen Wortschatz auswählen.");
        return;
    }

    if (!vokabeln[nummer]) {

        alert(
            "Für WS " + nummer +
            " sind in der hochgeladenen PDF keine Lernwörter vorhanden."
        );

        return;
    }

    aktuelleVokabeln = [...vokabeln[nummer]];

    mischen(aktuelleVokabeln);

    aktuelleNummer = 0;
    punkte = 0;
    beantwortet = false;

    document.getElementById("punkte").textContent = punkte;

    document.getElementById("start").style.display = "none";
    document.getElementById("ende").style.display = "none";
    document.getElementById("trainer").style.display = "block";

    zeigeFrage();
}


/*
=========================================================
FRAGE ANZEIGEN
=========================================================
*/

function zeigeFrage() {

    if (aktuelleNummer >= aktuelleVokabeln.length) {
        spielEnde();
        return;
    }

    beantwortet = false;

    const vokabel = aktuelleVokabeln[aktuelleNummer];

    document.getElementById("frage").textContent = vokabel[0];

    document.getElementById("fortschritt").textContent =
        (aktuelleNummer + 1) +
        " / " +
        aktuelleVokabeln.length;

    document.getElementById("antwort").value = "";

    document.getElementById("meldung").textContent = "";

    document.getElementById("antwort").focus();
}


/*
=========================================================
ANTWORT PRÜFEN
=========================================================
*/

function pruefen() {

    if (beantwortet) {
        return;
    }

    const eingabe =
        document.getElementById("antwort").value
        .trim()
        .toLowerCase();

    if (eingabe === "") {
        return;
    }

    const richtig =
        aktuelleVokabeln[aktuelleNummer][1]
        .toLowerCase();

    const erlaubteAntworten =
        richtig
        .split(";")
        .map(x => x.trim());

    let korrekt = false;

    for (const antwort of erlaubteAntworten) {

        if (
            eingabe === antwort ||
            eingabe.includes(antwort) ||
            antwort.includes(eingabe)
        ) {
            korrekt = true;
            break;
        }
    }


    beantwortet = true;


    if (korrekt) {

        punkte++;

        document.getElementById("punkte").textContent = punkte;

        document.getElementById("meldung").textContent =
            "✓ Richtig!";

    } else {

        document.getElementById("meldung").textContent =
            "✗ Falsch – richtig: " + richtig;
    }
}


/*
=========================================================
NÄCHSTE FRAGE
=========================================================
*/

function naechsteFrage() {

    if (!beantwortet) {
        return;
    }

    aktuelleNummer++;

    zeigeFrage();
}


/*
=========================================================
ENTER-TASTE
=========================================================
*/

document.getElementById("antwort").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            if (!beantwortet) {
                pruefen();
            } else {
                naechsteFrage();
            }

        }

    }
);


/*
=========================================================
SPIEL ENDE
=========================================================
*/

function spielEnde() {

    document.getElementById("trainer").style.display = "none";

    document.getElementById("ende").style.display = "block";

    document.getElementById("punkteEnde").textContent =
        punkte + " / " + aktuelleVokabeln.length;
}


/*
=========================================================
ZURÜCK
=========================================================
*/

function zurueck() {

    document.getElementById("trainer").style.display = "none";

    document.getElementById("ende").style.display = "none";

    document.getElementById("start").style.display = "block";
}


/*
=========================================================
MISCHEN
=========================================================
*/

function mischen(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }
}
